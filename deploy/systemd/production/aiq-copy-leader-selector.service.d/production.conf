[Service]
ExecStart=
ExecStart=/usr/bin/flock --exclusive --wait 1200 /run/ai-quant-copy-selection.lock /root/quantify/ai-quant-system/.venv/bin/python -m ai_quant.services.copy_leader_selector --environment PRODUCTION --database-url-file /run/ai-quant-secrets/copy-business-database-url --repository-root /root/quantify/ai-quant-system --config-file config/copy-trading.example.yaml --schema-file contracts/copy-leader-selection.schema.json --work-root /var/lib/ai-quant/codex/copy-selection/short --evidence-file /var/lib/ai-quant/evidence/copy-trading/selection/short/latest.json --leader-count 2 --candidate-pool-size 100 --review-pool-size 20 --strategy SHORT_TERM
